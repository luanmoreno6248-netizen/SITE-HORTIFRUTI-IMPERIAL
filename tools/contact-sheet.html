<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Verificação de imagens</title>
<style>
  body { background:#fff; font-family:Arial, sans-serif; margin:0; padding:20px; }
  h1 { font-size:22px; margin:0 0 16px; }
  .grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:14px; }
  .cell { border:2px solid #0F3D2E; border-radius:8px; overflow:hidden; background:#FDF9F0; }
  .cell img { width:100%; height:190px; object-fit:cover; display:block; background:#eee; }
  .cell .name { font-size:15px; font-weight:bold; padding:6px 8px; color:#0F3D2E; text-align:center; }
</style>
</head>
<body>
<h1>FOLHA DE CONTROLE — 31 IMAGENS</h1>
<div class="grid" id="grid"></div>
<script>
const files = ["cebola-branca","cebola-roxa","tomates","pimentao","cenoura","batatinha","batata-branca","uva-roxa","uva-verde","maca","pera","abacaxi","goiaba","mangas","melon","abacate","limao","inhame","chuchu","pepino","abobora","quiabo","maracuja","kiwi","ameixa-fresca","morango","pocam","cat-frutas","cat-verduras","cat-legumes","cat-temperos"];
document.getElementById('grid').innerHTML = files.map(f =>
  `<div class="cell"><img src="../assets/products/${f}.jpg"><div class="name">${f}</div></div>`).join('');
</script>
</body>
</html>
